[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-beat-instrumental-studio"
version = "0.6.2"
description = "AI beat / instrumental generator — plugin-host desktop studio for Windows"
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ai-beat-instrumental-studio contributors" }]
keywords = ["ai", "beat", "instrumental", "generator", "daw", "plugin-host", "music"]

dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "sounddevice>=0.4.6",
    "pydantic>=2.6",
    "tomli>=2.0; python_version < '3.11'",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]
cpu = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
beat-studio = "beatstudio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"